<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · Painel Maracayá</title>
<meta name="theme-color" content="#1E1B18">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--logo:url(/static/logo-clara.png);--bg:#F1EFEB;--surface:#fff;--surface-2:#E8E5DF;--ink:#1E1B18;--ink-2:#605A53;--line:#DCD7CF;--brasa:#D4511C;--bad:#B8342A;--bad-soft:#F7DAD6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--logo:url(/static/logo-escura.png);--bg:#141210;--surface:#1D1A17;--surface-2:#292521;--ink:#F2ECE5;--ink-2:#A69D93;--line:#35302B;--brasa:#F0743E;--bad:#EE6B5F;--bad-soft:#3D1E1B;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px}
.brand{margin-bottom:6px;text-align:center}
.logo{background:var(--logo) no-repeat center 49.5%/100% auto;aspect-ratio:2.7/1;width:230px;max-width:100%;margin:0 auto}
.sub{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;margin:14px 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:9px 4px;border-radius:8px;font:600 13.5px Figtree,sans-serif;color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px;font:16px Figtree,sans-serif}
input:focus,button:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
.go{width:100%;margin-top:18px;border:0;background:var(--brasa);color:#fff;border-radius:10px;padding:13px;font:700 15px Figtree,sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
.erro{margin-top:12px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:13px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="brand"><div class="logo" role="img" aria-label="Maracayá"></div><div class="sub">Painel do grupo</div></div>
  <div class="lbl">Perfil</div>
  <div class="seg" id="seg" role="group" aria-label="Perfil"><button type="button" data-p="socio" aria-pressed="true">Sócio</button><button type="button" data-p="gerente" aria-pressed="false">Gerente</button><button type="button" data-p="cozinha" aria-pressed="false">Cozinha</button></div>
  <div class="lbl"><label for="s">Senha</label></div>
  <input id="s" type="password" autocomplete="current-password" required autofocus>
  <button class="go" id="go">Entrar</button>
  <div class="erro" id="e" role="alert" hidden></div>
</form>
<script>
let perfil='';try{perfil=localStorage.getItem('m2-perfil-login')||''}catch(_){}
if(!['socio','gerente','cozinha'].includes(perfil))perfil='socio';
const seg=document.getElementById('seg'),f=document.getElementById('f'),e=document.getElementById('e');
function marca(){seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===perfil))}marca();
seg.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;perfil=b.dataset.p;marca();document.getElementById('s').focus()});
f.addEventListener('submit',async ev=>{ev.preventDefault();e.hidden=true;const go=document.getElementById('go');go.disabled=true;
  try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({perfil,senha:document.getElementById('s').value})});
    const d=await r.json().catch(()=>({}));
    if(d.ok){try{localStorage.setItem('m2-perfil-login',perfil)}catch(_){}
      const n=new URLSearchParams(location.search).get('next');location.href=(n&&n.startsWith('/')&&!n.startsWith('//')&&!n.startsWith('/login'))?n:'/'}
    else{e.textContent=d.erro||'Não foi possível entrar.';e.hidden=false;document.getElementById('s').select()}
  }catch(_){e.textContent='Sem conexão com o servidor.';e.hidden=false}
  go.disabled=false});
</script>
</body>
</html>
