<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>Painel Maracayá 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra do protótipo; palco com app (sidebar carvão + conteúdo) que vira app de celular com nav inferior quando estreito */
:root{
  --bg:#F1EFEB; --surface:#FFFFFF; --surface-2:#E8E5DF; --ink:#1E1B18; --ink-2:#605A53; --line:#DCD7CF;
  --brasa:#D4511C; --brasa-ink:#B8410F; --brasa-soft:#FADFD1;
  --side-bg:#1E1B18; --side-fg:#EDE7DF; --side-dim:#9C948A; --side-hi:#2E2A26;
  --ok:#2E7A4C; --ok-soft:#DCEFE3; --warn:#A86A10; --warn-soft:#F8EBCF; --bad:#B8342A; --bad-soft:#F7DAD6;
  --c-gc:#D4511C; --c-sob:#E6A23C; --c-chomp:#5B6B7A;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1D1A17; --surface-2:#292521; --ink:#F2ECE5; --ink-2:#A69D93; --line:#35302B;
  --brasa:#F0743E; --brasa-ink:#F59266; --brasa-soft:#3B2218;
  --side-bg:#0E0C0B; --side-fg:#EDE7DF; --side-dim:#8A8279; --side-hi:#221F1C;
  --ok:#5DBB83; --ok-soft:#1D3326; --warn:#E3A84A; --warn-soft:#3A2D14; --bad:#EE6B5F; --bad-soft:#3D1E1B;
  --c-gc:#F0743E; --c-sob:#E9B45A; --c-chomp:#8EA0B2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1D1A17; --surface-2:#292521; --ink:#F2ECE5; --ink-2:#A69D93; --line:#35302B;
  --brasa:#F0743E; --brasa-ink:#F59266; --brasa-soft:#3B2218;
  --side-bg:#0E0C0B; --side-fg:#EDE7DF; --side-dim:#8A8279; --side-hi:#221F1C;
  --ok:#5DBB83; --ok-soft:#1D3326; --warn:#E3A84A; --warn-soft:#3A2D14; --bad:#EE6B5F; --bad-soft:#3D1E1B;
  --c-gc:#F0743E; --c-sob:#E9B45A; --c-chomp:#8EA0B2; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brasa);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.proto{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.proto h1{font-family:var(--f-display);font-weight:800;font-size:17px;margin:0;letter-spacing:-.01em;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.proto h1 small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--ink-2)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}

.stage{display:flex;justify-content:center;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{container-type:inline-size;container-name:dev;width:100%;max-width:1360px;height:calc(100dvh - 110px);min-height:560px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);transition:max-width .3s ease}
.stage.phone .device{max-width:392px;height:min(820px,calc(100dvh - 110px));border:10px solid var(--ink);border-radius:46px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media (max-width:760px){.stage{padding:0}.device,.stage.phone .device{max-width:none;border:0;border-radius:0;box-shadow:none;height:calc(100dvh - 92px)}.devseg{display:none!important}}
@media (prefers-reduced-motion:reduce){.device{transition:none}}

.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr;height:100%;background:var(--bg)}
.side{background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--brasa);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:18px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.02em;display:block}
.brand span{font-size:11px;color:var(--side-dim)}
.navgrp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-dim);padding:12px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--side-hi)}
.nav a[aria-current="page"]{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--brasa)}
.nav svg,.bnav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tag-new{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.06em;background:var(--brasa);color:#fff;padding:1px 6px;border-radius:99px}
.side-foot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--side-dim);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;display:inline-block}

.main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 24px 10px;border-bottom:1px solid var(--line)}
.top h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.top .sub{color:var(--ink-2);font-size:12.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:99px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.jump{display:flex;gap:6px;overflow-x:auto;padding:10px 24px 0;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--surface)}
.jump a:hover{color:var(--ink);border-color:var(--ink-2)}
.content{padding:16px 24px 32px;display:grid;gap:16px;align-content:start}
.bnav{display:none}

.g{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.s12{grid-column:span 12}.s9{grid-column:span 9}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;scroll-margin-top:90px}
.card h3{margin:0 0 2px;font-size:14px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .hint{color:var(--ink-2);font-size:12px;margin:0 0 12px}
.sec{grid-column:span 12;font-family:var(--f-display);font-weight:800;font-size:16px;margin:8px 0 -6px;display:flex;align-items:center;gap:10px;scroll-margin-top:90px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kpi .k-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600}
.kpi .k-v{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-s{font-size:12px;color:var(--ink-2);margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.ex{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--ink-2);border-radius:5px;padding:0 5px;vertical-align:1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-new{background:var(--brasa-soft);color:var(--brasa-ink)}.p-n{background:var(--surface-2);color:var(--ink-2)}
.ze-note{display:flex;gap:10px;align-items:flex-start;background:var(--brasa-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--ink)}
.ze-note b{color:var(--brasa-ink)}
.ze-note .zi{width:26px;height:26px;border-radius:50%;background:var(--brasa);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;font-family:var(--f-display)}
.ze-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}

.goal{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.goal-big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:-.03em;color:var(--brasa)}
.track{position:relative;height:12px;background:var(--surface-2);border-radius:99px;margin:10px 0 8px}
.track i{position:absolute;inset:0 auto 0 0;background:var(--brasa);border-radius:99px}
.track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.track u{position:absolute;inset:0 auto 0 0;border-radius:99px;border:2px dashed var(--brasa);opacity:.55}
.goal-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.goal-meta strong{color:var(--ink)}

.actions{display:grid;gap:10px}
.act{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.act::before{content:"";align-self:stretch;border-radius:12px 0 0 12px;background:var(--sev,var(--warn))}
.act.bad{--sev:var(--bad)}.act.ok{--sev:var(--ok)}
.act h4{margin:0;font-size:13.5px}
.act p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.btn{border:0;background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.brasa{background:var(--brasa);color:#fff}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.r,th.r{text-align:right}
td.wrap{white-space:normal}
tr:last-child td{border-bottom:0}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--surface-2)}
tr.det td{background:var(--surface-2);white-space:normal}
.cin{width:84px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;text-align:right;font-variant-numeric:tabular-nums}
details.more{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
details.more summary{cursor:pointer;font-weight:600;font-size:12.5px;color:var(--brasa-ink);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more[open] summary{margin-bottom:8px}

.hbars{display:grid;gap:7px}
.hb{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .b{height:10px;background:var(--surface-2);border-radius:99px;position:relative}
.hb .b i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brasa)}
.hb .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:52px}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-2);font-family:var(--f-body);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:3px;font-size:11px}
.heat div{border-radius:4px;min-height:24px;display:grid;place-items:center;color:var(--ink-2)}
.heat .c{color:var(--ink);font-weight:600;font-size:10.5px}

.list{display:grid}
.li{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:13px}
.li small{display:block;color:var(--ink-2);font-size:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;accent-color:var(--brasa);margin:1px 0 0;flex:none}
.check input:checked + span{text-decoration:line-through;color:var(--ink-2)}
.rfv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rfv div{border-radius:10px;padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between}
.rfv b{font-size:12px}.rfv span{font-family:var(--f-display);font-weight:800;font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:11px}
.cal div{border-radius:6px;padding:4px;min-height:44px;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.cal .h{background:none;min-height:0;text-align:center;font-weight:600;color:var(--ink-2)}
.cal .e{background:none}
.cal .on{background:var(--brasa-soft)}
.cal .on b{color:var(--brasa-ink)}
.cal .big{background:var(--brasa);color:#fff}.cal .big b{color:#fff}
form.nf{display:grid;gap:10px;grid-template-columns:1fr 1fr}
form.nf label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
form.nf input,form.nf select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink)}

.chat{display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%}
.msg{max-width:85%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.ze{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.ze b.who{display:block;font-size:11px;color:var(--brasa-ink);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.ask{display:flex;gap:8px;max-width:760px;width:100%;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.ask input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}

.prop-hero{background:var(--side-bg);color:var(--side-fg);border-radius:16px;padding:26px 26px 22px}
.prop-hero h3{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance;max-width:24ch}
.prop-hero p{margin:0;color:var(--side-dim);max-width:64ch}
.phase{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:0}
.phase .n{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--brasa);grid-row:span 2;line-height:1}
.phase h4{margin:0;font-size:14px}
.phase ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}
.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 16px 20px;z-index:20;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:12px;background:var(--surface-2);text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;text-align:center}
.sheet svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

.rfv-wrap{display:grid;grid-template-columns:20px 1fr;gap:6px;overflow-x:auto}
.rfv-y{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;color:var(--ink-2);text-align:center}
.rfv-grid{display:grid;grid-template-columns:repeat(5,minmax(92px,1fr));grid-template-rows:repeat(5,minmax(62px,auto));gap:4px;min-width:500px}
.rfv-cell{border:0;border-radius:6px;color:#fff;text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;align-items:flex-start;justify-content:flex-start;min-width:0}
.rfv-cell b{font-size:13px;line-height:1.2}.rfv-cell span{font-family:var(--f-mono);font-size:12px}.rfv-cell small{font-family:var(--f-mono);font-size:10.5px;opacity:.85}
.rfv-cell:hover{filter:brightness(1.1)}.rfv-cell.sel{outline:3px solid var(--ink);outline-offset:2px}
.rfv-x{font-size:11px;color:var(--ink-2);text-align:center;margin-top:6px}
.rfv-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.modal-bg{position:absolute;inset:0;background:rgba(20,16,12,.5);z-index:30;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:580px;min-width:0;max-height:100%;overflow:auto;padding:18px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.m-head h3{margin:2px 0 0;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.modal .hint{color:var(--ink-2);font-size:12.5px;margin:0 0 12px}
.mform{display:grid;gap:12px;min-width:0}
.mform input,.mform select{min-width:0;width:100%}
.mform label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mform label small{font-weight:500}
.mform input:not([type=checkbox]):not(.cin),.mform select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;color:var(--ink);font-size:15px}
.mform .chk{display:flex;gap:8px;align-items:center;color:var(--ink)}

    const top=Math.min(y1,y2),h=Math.max(Math.abs(y2-y1),1);
    s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${fill}" ${dash?'stroke="var(--ink-2)" stroke-dasharray="4 3"':''} rx="2"><title>${n}: ${brl(v,2)}</title></rect>`;
    s+=`<text x="${x+w/2}" y="${top-4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${v<0&&k&&k.startsWith('t')?'−':''}${n1(Math.abs(v)/1000,1)}k</text>`;
    const p=n.split(' ');s+=`<text x="${x+w/2}" y="${H-16}" text-anchor="middle">${p[0]}</text>${p[1]?`<text x="${x+w/2}" y="${H-3}" text-anchor="middle">${p[1]}</text>`:''}`});
  return s+'</svg>';
}

function quadrant(){
  const items=PROD.filter(p=>p[1]>=15&&!/REFRIGERANTES|CERVEJAS/.test(p[0])).map(p=>({n:p[0],q:p[1],m:1-p[4]/p[3]}));
  const W=600,H=340,pl=40,pr=10,pt=14,pb=30;const lq=v=>Math.log10(v);
  const xmin=lq(14),xmax=lq(650),ymin=.4,ymax=1;
  const X=v=>pl+(lq(v)-xmin)/(xmax-xmin)*(W-pl-pr),Y=v=>H-pb-(Math.min(v,ymax)-ymin)/(ymax-ymin)*(H-pt-pb);
  const mq=items.map(i=>i.q).sort((a,b)=>a-b)[Math.floor(items.length/2)],mm=items.reduce((a,i)=>a+i.m,0)/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Engenharia de cardápio">`;
  s+=`<rect x="${X(mq)}" y="${pt}" width="${W-pr-X(mq)}" height="${Y(mm)-pt}" fill="var(--ok-soft)"/><rect x="${pl}" y="${Y(mm)}" width="${X(mq)-pl}" height="${H-pb-Y(mm)}" fill="var(--bad-soft)"/>`;
  s+=`<line class="grid" x1="${X(mq)}" x2="${X(mq)}" y1="${pt}" y2="${H-pb}"/><line class="grid" x1="${pl}" x2="${W-pr}" y1="${Y(mm)}" y2="${Y(mm)}"/>`;
  [.5,.6,.7,.8,.9].forEach(v=>{s+=`<text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*100)}%</text>`});
  [20,50,100,200,500].forEach(v=>{s+=`<text x="${X(v)}" y="${H-14}" text-anchor="middle">${v}</text>`});
  s+=`<text x="${W-pr-6}" y="${pt+14}" text-anchor="end" style="font-weight:700;fill:var(--ok)">ESTRELAS</text><text x="${pl+6}" y="${pt+14}" style="font-weight:700">QUEBRA-CABEÇAS</text><text x="${W-pr-6}" y="${H-pb-6}" text-anchor="end" style="font-weight:700">BURROS DE CARGA</text><text x="${pl+6}" y="${H-pb-6}" style="font-weight:700;fill:var(--bad)">CÃES</text>`;
  s+=`<text x="${(W+pl)/2}" y="${H-1}" text-anchor="middle">unidades vendidas em 90 dias (escala log) →</text>`;
  items.forEach(i=>{const cx=X(i.q),cy=Y(i.m),sus=i.m>.9;const LB={'Combo Fera C/Refrigerante':[-8,-10,'end'],'FERINHA':[0,-12,'middle'],'DUPLO FERA':[-8,16,'end'],'BATATA FRITA':[8,4,'start'],'NUGGETS':[8,4,'start'],'COMBO PAI E FILHO + BRINDE':[8,4,'start']};const lbl=!!LB[i.n];const o=LB[i.n]||[8,4,'start'];

    if(lbl)s+=`<text x="${cx+o[0]}" y="${cy+o[1]}" text-anchor="${o[2]}" style="fill:var(--ink);font-size:10.5px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:3px">${i.n.replace(/ ?C\/(Refrigerante|REFRI|Refri)/,'').replace('COMBO','Combo').replace(' + BRINDE','').slice(0,20)}</text>`});
  return s+'</svg>';
}

function updRecEnt(){const ins=[...document.querySelectorAll('#fRecEnt [data-item]')];if(!ins.length)return;let falt=0,ok=0,pre=0;

  'Quanto falta pra meta?':`Faltam <strong>${brl(META.falta,2)}</strong> pros R$ 70 mil de outubro. Com ${META.rest} dias pela frente, precisa de ${brl(META.nec,2)} por dia, e o ritmo atual é ${brl(META.ritmo,2)}. No ritmo de hoje fecha perto de <strong>${brl(META.proj)}</strong>.`,
  'Qual canal dá mais lucro?':'Balcão (portal) fica na faixa de 55% a 60% de margem por pedido. iFood fica entre 20% e 45%: comissão de 12% + 3,2% e frete grátis bancado pela loja. Nos últimos 30 dias o iFood levou R$ 3.743,71 em comissão.',
  'Setembro foi melhor que agosto?':'Por pouco não. Setembro fechou em <strong>R$ 55.678,94</strong> e agosto em R$ 56.416,06 (−1%). O GC cresceu (R$ 41,8 mil → R$ 45,3 mil), mas Sobradinho e Chomp caíram.',
  'O que pedir hoje?':'Quatro pedidos têm prazo até hoje: Brasal (R$ 7,10), Juju Batata (R$ 300), Ki Karnes (R$ 786) e Pão e Roça (R$ 116,10). E o guardanapo da Garra está zerado.',
  'Quem eu devo chamar no zap?':'A lista de resgate tem 359 clientes que gastavam R$ 61,4 mil. Os primeiros: Fernando (8 pedidos, sumido há 171 dias), Guga G. (12 pedidos, 30 dias) e Daniella P. (8 pedidos, 67 dias).'
};
function ze(){
  return `<div class="chat" id="chat">
   <div class="msg ze"><b class="who">Zé Claudinho</b>Bom dia, Álvaro. Hoje é quinta: a média é de 17 pedidos e a meta do mês está em ${n1(META.pct,0)}%. Pergunta o que quiser sobre vendas, clientes, cardápio ou compras.</div>
   <div class="msg me">Como foi ontem?</div>
   <div class="msg ze"><b class="who">Zé Claudinho</b>Quarta (21/10) teve 15 pedidos e R$ 786,15, um pouco abaixo da média das quartas (16,8). Melhor pedido: #3470 no balcão, R$ 99,60 com 63% de margem. Nenhum cancelamento.</div>
  </div>
  <div class="filters" style="max-width:760px">${Object.keys(ZE_QA).map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join('')}</div>
  <form class="ask" id="askF"><input id="askI" placeholder="Pergunte sobre vendas, clientes, compras…" aria-label="Pergunta"><button class="btn brasa">Enviar</button></form>`;
}
function proposta(){
  const mp=[['Visão geral','vendas','tudo, com tabelas em "ver mais"'],['Performance','resultado','junto com o DRE e os parâmetros'],['DRE','resultado','+ despesas fixas e lucro real'],['Clientes','clientes','tudo, com a Matriz RFV no mesmo desenho da 1.0'],['Operação','operacao','tudo; a lista de compras foi pra Compras'],['Cardápio','cardapio','tudo + alerta de custo suspeito'],['Bairros','bairros','tudo'],['Compras','compras','tudo (📥 receber, 🕘 histórico, estoque editável) + entrega conferida item a item e contagem da câmara'],['Lançar Nota','nota','+ lançamento pela foto']];
  return `<div class="prop-hero"><div class="lbl" style="color:var(--side-dim)">Proposta · versão 2.0</div><h3>Tudo que a 1.0 mostra, organizado pra caber no bolso</h3><p>Nenhum gráfico ou tabela da 1.0 saiu. O que mudou é a ordem: resumo e alerta em cima, detalhe embaixo e tabela longa dentro de "ver mais". Cada perfil vê só o que precisa, e quatro módulos novos entram.</p></div>
  <div class="g">
  <div class="card s7"><h3>Onde foi parar cada aba da 1.0</h3><p class="hint">Os atalhos no topo de cada tela levam direto pra cada seção</p>${table(['1.0','2.0','O que mudou'],mp.map(m=>[m[0],`<a href="#${m[1]}" data-go="${m[1]}" style="color:var(--brasa-ink);font-weight:600">${S[m[1]].t}</a>`,`<span style="color:var(--ink-2);white-space:normal">${m[2]}</span>`]))}</div>
  <div class="card s5"><h3>Módulos novos</h3><div class="tw"><table><tbody>
  <tr><td><strong>Hoje</strong></td><td class="wrap">Tela inicial por perfil, com ações do dia</td></tr>
  <tr><td><strong>Pergunte ao Zé</strong></td><td class="wrap">O assistente do zap dentro do painel</td></tr>
  <tr><td><strong>Comparar unidades</strong></td><td class="wrap">GC, Sobradinho e Chomp lado a lado</td></tr>
  <tr><td><strong>Equipe</strong></td><td class="wrap">Checklists, escala e recado do dia</td></tr>
  <tr><td><strong>Lucro real</strong></td><td class="wrap">Despesas fixas no DRE</td></tr>
  <tr><td><strong>Nota pela foto</strong></td><td class="wrap">Lançamento pela câmera</td></tr></tbody></table></div></div>
  <div class="card s7"><h3>Ordem de construção sugerida</h3>
   <div class="phase"><div class="n">1</div><h4>Fundação</h4><ul><li>Domínio + Elastic IP + HTTPS (Caddy), fechando 8080 e 5678</li><li>Login com perfis Sócio / Gerente / Cozinha</li><li>Trocar senhas e tokens que passaram pelo chat</li></ul></div>
   <div class="phase"><div class="n">2</div><h4>Casca nova</h4><ul><li>Layout responsivo, navegação inferior e PWA instalável</li><li>Reorganizar as 9 abas nas telas novas, sem perder nada</li></ul></div>
   <div class="phase"><div class="n">3</div><h4>Módulos</h4><ul><li>Comparar unidades e Lucro real (os dados já existem)</li><li>Equipe e checklists (tabelas novas)</li><li>Zé no painel (reaproveita /api/zap/pergunta) e nota pela foto</li></ul></div></div>
  <div class="card s5"><h3>Por que a fundação vem antes</h3><p class="hint" style="margin:0;color:var(--ink);font-size:13px">Hoje o painel abre por IP, sem senha e sem HTTPS. Liberar pra equipe assim expõe DRE, margens e telefones de clientes. E o celular só instala o app e mostra notificação em endereço com HTTPS.</p><p class="hint" style="margin:14px 0 0">O que fica igual: FastAPI, Postgres, sincronizadores, n8n e robôs do WhatsApp. A 2.0 é uma camada nova por cima das mesmas APIs.</p></div></div>`;
}
const SUBS={hoje:{socio:'Quinta, 22 de outubro · grupo inteiro',gerente:'Turno da noite · Maracayá GC',cozinha:'Produção e checklist'},ze:'Assistente com os números do painel',equipe:'Checklists, escala e recados',vendas:'Antiga Visão geral · últimos 30 dias',resultado:'Antigas Performance + DRE · este mês',unidades:'GC, Sobradinho e Chomp lado a lado',clientes:'Base, fidelização e resgate',cardapio:'O que vende e o que dá margem · 90 dias',bairros:'Onde estão os pedidos · 90 dias',operacao:'Ritmo, tempos e previsão · 8 semanas',compras:'Pedidos, estoque, boletos e fornecedores',nota:'Notas fiscais de entrada',proposta:'O que muda e em que ordem'};
const JUMPS={hoje:{socio:[['meta','Meta'],['acoes','Ações'],['ontem','Ontem'],['semana','Semana'],['resumo','Resumo']]},vendas:[['dia','Por dia'],['pico','Pico'],['campeoes','Campeões'],['semana','Dia da semana'],['mes','Por mês'],['canais','Canais'],['pagamento','Pagamento']],resultado:[['cascata','Cascata'],['custos','Custos'],['dre','DRE'],['parametros','Parâmetros'],['cancel','Cancelamentos'],['pedidos','Pedidos']],clientes:[['rfv','Matriz RFV'],['escada','Fidelização'],['recencia','Recência'],['resgate','Resgate'],['risco','Em risco'],['ciclos','Tempo entre pedidos'],['novos','Novos'],['retencao','Retenção'],['lista','Lista']],cardapio:[['quadrante','Quadrante'],['encalhados','Encalhados'],['custos','Custos']],bairros:[['mapa','Mapa'],['ranking','Ranking']],operacao:[['leituras','Leituras'],['manual','Manual'],['calor','Calor'],['previsao','Previsão'],['tempos','Tempos'],['comparativo','Semanas']],compras:[['estoque','Estoque'],['ordem','Pedir'],['boletos','Boletos'],['horti','Hortifrúti'],['fornecedores','Fornecedores']]};

function render(){
  closeModal();
  if(!S[screen].roles.includes(role))screen='hoje';
  let html='',grp='';
  Object.entries(S).forEach(([k,s])=>{if(!s.roles.includes(role))return;if(s.grp!==grp){grp=s.grp;html+=`<div class="navgrp">${grp}</div>`}
    html+=`<a href="#${k}" data-go="${k}" ${k===screen?'aria-current="page"':''}>${svg(k)}${s.t}${s.nw?'<span class="tag-new">NOVO</span>':''}</a>`});
  document.getElementById('nav').innerHTML=html;
  document.getElementById('bnav').innerHTML=BOTTOM[role].map(k=>{const lab=k==='mais'?'Mais':k==='ze'?'Zé':S[k].t.split(' ')[0];const cur=(k===screen||(k==='mais'&&sheetOpen))?'aria-current="page"':'';
    return k==='ze'?`<a href="#ze" data-go="ze" class="ze-btn" ${cur}><span class="z">${svg('ze')}</span>${lab}</a>`:`<a href="#${k}" data-go="${k}" ${cur}>${svg(k)}${lab}</a>`}).join('');
  document.getElementById('ttl').textContent=screen==='hoje'?({socio:'Bom dia, Álvaro',gerente:'Turno de hoje',cozinha:'Cozinha'})[role]:S[screen].t;
  const sub=SUBS[screen];document.getElementById('sub').textContent=typeof sub==='string'?sub:sub[role];
  document.getElementById('filters').innerHTML=FILTRO.includes(screen)?`<select id="f-un" aria-label="Unidade"><option>Todas as unidades</option><option>Colorado (GC)</option><option>Sobradinho</option></select><select id="f-mc" aria-label="Marca"><option>Todas as marcas</option><option>Maracayá</option><option>Chomp</option></select><select id="f-per" aria-label="Período"><option>Período padrão</option><option>Hoje</option><option>Ontem</option><option>7 dias</option><option>30 dias</option><option>90 dias</option><option>Este mês</option><option>Mês passado</option></select>`:'';
  const j=JUMPS[screen];const jl=j?(Array.isArray(j)?j:j[role]):null;
  const jn=document.getElementById('jump');jn.innerHTML=jl?jl.map(x=>`<a href="#${screen}" data-jump="${x[0]}">${x[1]}</a>`).join(''):'';jn.hidden=!jl;
  const C={hoje:{socio:hojeSocio,gerente:hojeGerente,cozinha:hojeCozinha}[role],vendas,resultado,ze,clientes,cardapio,bairros,operacao,unidades,equipe,compras,nota,proposta};
  document.getElementById('content').innerHTML=C[screen]();
  const old=document.querySelector('.sheet');if(old)old.remove();
  if(sheetOpen){const used=BOTTOM[role];const rest=Object.keys(S).filter(k=>S[k].roles.includes(role)&&!used.includes(k));
    const el=document.createElement('div');el.className='sheet';el.innerHTML=`<div class="lbl" style="margin-bottom:10px">Mais telas</div><div class="grid3">${rest.map(k=>`<a href="#${k}" data-go="${k}">${svg(k)}${S[k].t}</a>`).join('')}</div>`;
    document.getElementById('app').appendChild(el)}
  document.getElementById('main').scrollTop=0;
  if(screen==='ze')document.getElementById('askF').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('askI');if(!i.value.trim())return;zeSay(i.value.trim());i.value=''});
}
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function zeSay(q){const chat=document.getElementById('chat');chat.insertAdjacentHTML('beforeend',`<div class="msg me">${q.replace(/</g,'&lt;')}</div>`);
  const a=ZE_QA[q]||'No protótipo eu respondo só as perguntas sugeridas. Na versão de verdade a pergunta vai pro mesmo motor do grupo do WhatsApp (/api/zap/pergunta), que consulta o banco.';
  setTimeout(()=>{chat.insertAdjacentHTML('beforeend',`<div class="msg ze"><b class="who">Zé Claudinho</b>${a}</div>`);document.getElementById('main').scrollTop=1e6},350)}

const notas=[];
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();const k=go.dataset.go;if(k==='mais'){sheetOpen=!sheetOpen}else{screen=k;sheetOpen=false;try{history.replaceState(null,'','#'+k)}catch(_){}}render();return}
  const jp=e.target.closest('[data-jump]');if(jp){e.preventDefault();const t=document.getElementById(jp.dataset.jump);if(t)t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return}
  const r=e.target.closest('[data-role]');if(r){role=r.dataset.role;screen='hoje';sheetOpen=false;document.querySelectorAll('#roleSeg button').forEach(b=>b.setAttribute('aria-pressed',b===r));render();return}
  const d=e.target.closest('[data-dev]');if(d){document.getElementById('stage').classList.toggle('phone',d.dataset.dev==='phone');document.querySelectorAll('#devSeg button').forEach(b=>b.setAttribute('aria-pressed',b===d));try{localStorage.setItem('m2-dev',d.dataset.dev)}catch(_){}return}
  const q=e.target.closest('[data-q]');if(q){zeSay(q.dataset.q);return}
  const tr=e.target.closest('tr[data-ped]');if(tr){const nx=tr.nextElementSibling;if(nx&&nx.classList.contains('det')){nx.remove();return}
    const p=PEDIDOS[+tr.dataset.ped];const row=document.createElement('tr');row.className='det';
    row.innerHTML=`<td colspan="11"><strong>Pedido #${p[0]}</strong> · ${p[1]} · ${p[2]} · ${p[3]}<br>Subtotal ${brl(p[4],2)} − desconto da loja ${brl(p[5],2)} − comissão e taxa ${brl(p[6],2)} − imposto 4% − CMV ${brl(p[7],2)} − frete ${brl(p[8],2)} = <strong class="${p[9]<0?'down':''}">lucro ${brl(p[9],2)} (${n1(p[10])}%)</strong>${p[9]<0?'<br><span class="down">Pedido no prejuízo: '+(p[5]>=p[4]?'desconto de 100% no balcão.':'cupom maior que a margem de um pedido pequeno.')+'</span>':''}</td>`;tr.after(row);return}
  if(e.target.closest('[data-close]')||e.target.classList.contains('modal-bg')){closeModal();return}
  const rv=e.target.closest('[data-rfv]');if(rv){rfvSel=rfvSel===rv.dataset.rfv?null:rv.dataset.rfv;const y=document.getElementById('main').scrollTop;render();document.getElementById('main').scrollTop=y;const pn=document.getElementById('rfvPanel');if(pn)pn.scrollIntoView({block:'nearest'});return}
  if(e.target.closest('[data-rfv-close]')){rfvSel=null;const y=document.getElementById('main').scrollTop;render();document.getElementById('main').scrollTop=y;return}
  const rc=e.target.closest('[data-rec]');if(rc){dlgReceberItem(+rc.dataset.rec);return}
  const hs=e.target.closest('[data-hist]');if(hs){dlgHist(+hs.dataset.hist);return}
  const st=e.target.closest('[data-step]');if(st){const ie=document.getElementById('rEmb');ie.value=Math.max(0,(+ie.value||0)+(+st.dataset.step));const s=STK[+document.getElementById('fRecItem').dataset.i];document.getElementById('rQtd').value=(+ie.value)*s.embQ;updRecPrev();return}
  const sg=e.target.closest('[data-seg]');if(sg){SEG=+sg.dataset.seg;rerenderCompras();return}
  const ct=e.target.closest('[data-cat]');if(ct){contCat=ct.dataset.cat;dlgContagem();return}
  const a=e.target.closest('[data-do]');if(a){const t=a.dataset.do;
    if(t==='receberEntrega'){dlgReceberEntrega();return}
    if(t==='contagem'){dlgContagem();return}
    if(t==='tudoCerto'){document.querySelectorAll('#fRecEnt [data-item]').forEach(i=>{i.value=i.dataset.ped||0});updRecEnt();return}
    if(t==='novoItem'){toast('Abre o cadastro de insumo: fornecedor, unidade, embalagem, mínimo e custo (simulação)');return}
    if(t==='zapseg'){toast('Mensagem pronta pro grupo selecionado (simulação)');return}
    const msg={zap:'Mensagem pronta aberta no WhatsApp (simulação)',pedido:'4 pedidos montados pros fornecedores (simulação)',receber:'Abre a conferência da entrega item a item (simulação)',hist:'Abre o histórico de entradas no estoque (simulação)',novo:'Abre o cadastro de fornecedor (simulação)'};
    if(t==='seg'){a.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===a));toast('Na versão real troca entre bairro e condomínio')}else if(msg[t])toast(msg[t]);
    return}
  if(sheetOpen&&!e.target.closest('.sheet')){sheetOpen=false;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='rEmb'){const s=STK[+document.getElementById('fRecItem').dataset.i];document.getElementById('rQtd').value=(+t.value||0)*s.embQ;updRecPrev()}
  if(t.id==='rQtd')updRecPrev();
  if(t.dataset.item!==undefined)updRecEnt();
  if(t.dataset.cont!==undefined){const s=STK[+t.dataset.cont],el=document.getElementById('cd-'+t.dataset.cont);if(t.value===''){el.textContent='';return}const d=Math.round((+t.value)*(+t.dataset.f))-(s.est||0);el.textContent=d===0?'bate com o sistema':(d>0?'+':'−')+fq(Math.abs(d),s.un)+' de diferença';el.className='cdiff '+(d===0?'up':'down')}
});
document.addEventListener('change',e=>{
  if(e.target.id==='recForn'){recForn=e.target.value;dlgReceberEntrega();return}
  if(e.target.dataset&&e.target.dataset.est!==undefined){const s=STK[+e.target.dataset.est];const v=e.target.value===''?null:+e.target.value;const d=(v||0)-(s.est||0);s.est=v;s.mov.unshift([nowStr(),'✏️ Contagem manual',d,v]);rerenderCompras();toast(`Estoque de ${s.nome} atualizado pra ${fq(v,s.un)}`);return}
  if(e.target.id==='notaFoto'&&e.target.files.length)toast('Zé leu a nota: Ki Karnes · 12 itens · R$ 2.384,10 (exemplo)');
  if(e.target.id==='fixas'){FIXAS=Math.max(0,+e.target.value||0);render();const c=document.getElementById('cascata');if(c)c.scrollIntoView({block:'start'})}
  if(['f-un','f-mc','f-per','p-imp','p-ent','p-if'].includes(e.target.id))toast('No protótipo os números não mudam com filtros');
  if(e.target.id&&e.target.id.startsWith('cmv-'))toast('CMV salvo (simulação)');
});
document.addEventListener('submit',e=>{
  if(e.target.id==='fRecItem'){e.preventDefault();const s=STK[+e.target.dataset.i];const q=recQ();if(!q){toast('Informe a quantidade que chegou');return}
    s.est=(s.est||0)+q;const ob=document.getElementById('rObs').value.trim();s.mov.unshift([nowStr(),'📥 Entrega '+s.forn+(ob?' · '+ob:''),q,s.est]);closeModal();rerenderCompras();toast(`+${fq(q,s.un)} de ${s.nome} somados ao estoque`);return}
  if(e.target.id==='fRecEnt'){e.preventDefault();let n=0,falt=0;document.querySelectorAll('#fRecEnt [data-item]').forEach(i=>{if(i.value==='')return;const q=Math.round((+i.value)*(+i.dataset.f)),s=stk(i.dataset.item);if(!s||!q)return;s.est=(s.est||0)+q;s.mov.unshift([nowStr(),'📥 Entrega '+recForn,q,s.est]);n++;if(+i.dataset.ped&&+i.value<+i.dataset.ped)falt++});
    if(!n){toast('Preencha pelo menos um item que chegou');return}const nota=document.getElementById('recNota').checked;closeModal();rerenderCompras();toast(`Entrada de ${recForn} salva · ${n} ${n>1?'itens':'item'}${falt?` · ${falt} com falta registrada`:''}${nota?' · agora tire a foto da nota':''}`);return}
  if(e.target.id==='fCont'){e.preventDefault();let n=0;document.querySelectorAll('#fCont [data-cont]').forEach(i=>{if(i.value==='')return;const s=STK[+i.dataset.cont],v=Math.round((+i.value)*(+i.dataset.f)),d=v-(s.est||0);s.est=v;s.mov.unshift([nowStr(),'✏️ Contagem manual',d,v]);n++});
    if(!n){toast('Conte pelo menos um item');return}closeModal();rerenderCompras();toast(`Contagem salva · ${n} ${n>1?'itens ajustados':'item ajustado'}`);return}
  if(e.target.id!=='nf')return;e.preventDefault();const v=+document.getElementById('nf-v').value;if(!v){toast('Preencha o valor da nota');return}
  notas.push([document.getElementById('nf-f').value,document.getElementById('nf-d').value.split('-').reverse().slice(0,2).join('/'),v]);
  document.getElementById('nfList').innerHTML=table(['Fornecedor','Data','Valor'],notas.map(n=>[n[0],n[1],brl(n[2],2)]),[2]);
  document.getElementById('nfTot').textContent=brl(notas.reduce((a,n)=>a+n[2],0),2);e.target.reset();toast('Nota salva')});

const h=(location.hash||'').slice(1);if(S[h])screen=h;
try{if(localStorage.getItem('m2-dev')==='phone'){document.getElementById('stage').classList.add('phone');document.querySelectorAll('#devSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev==='phone'))}}catch(_){}
render();
})();
</script>
